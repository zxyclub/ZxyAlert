name: ZxyAlert Auto Run

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode - send simple test message'
        required: false
        default: 'false'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run alert script
        run: python scripts/run_alert.py
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
          MY_CONFIG_GIST_ID: ${{ secrets.MY_CONFIG_GIST_ID }}
          MY_GIST_OWNER: ${{ secrets.MY_GIST_OWNER }}
          TEST_MODE: ${{ inputs.test_mode || 'false' }}